<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOLIK Cephalon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            color: #c9d1d9;
            overflow: hidden;
        }
        #canvas {
            width: 100%;
            height: 100vh;
            display: block;
        }
        #ui-overlay {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1rem;
            z-index: 10;
            pointer-events: none;
        }
        .btn {
            pointer-events: auto;
            padding: 0.75rem 1.5rem;
            border: 1px solid #30363d;
            background: #161b22;
            color: #58a6ff;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.875rem;
            transition: all 0.15s ease;
        }
        .btn:hover {
            background: #58a6ff;
            color: #0d1117;
            border-color: #58a6ff;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #status-bar {
            position: fixed;
            top: 1rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1.5rem;
            padding: 0.5rem 1rem;
            background: rgba(22, 27, 34, 0.9);
            border: 1px solid #30363d;
            border-radius: 999px;
            backdrop-filter: blur(8px);
            z-index: 10;
            pointer-events: none;
        }
        .status-item {
            display: flex;
            align-items: center;
            gap: 0.375rem;
            font-size: 0.75rem;
            color: #8b949e;
        }
        .status-dot {
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 50%;
        }
        .status-dot.healthy { background: #3fb950; }
        .status-dot.warning { background: #d29922; }
        .status-dot.critical { background: #f85149; }
        #subtitle {
            position: fixed;
            bottom: 5rem;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            max-width: 80%;
            color: #8b949e;
            font-size: 1rem;
            line-height: 1.5;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #subtitle.visible {
            opacity: 1;
        }
        .mode-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            padding: 0.25rem 0.75rem;
            border: 1px solid #30363d;
            background: #161b22;
            border-radius: 999px;
            font-size: 0.75rem;
            color: #58a6ff;
        }
        .mode-badge.active {
            border-color: #58a6ff;
            color: #58a6ff;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="status-bar">
        <div class="status-item">
            <span class="status-dot" id="core-status"></span>
            <span>Core</span>
        </div>
        <div class="status-item">
            <span class="status-dot" id="voice-status"></span>
            <span>Voice</span>
        </div>
        <div class="status-item">
            <span class="status-dot" id="agent-status"></span>
            <span>Agent</span>
        </div>
        <div class="status-item">
            <span class="status-dot" id="memory-status"></span>
            <span>Memory</span>
        </div>
    </div>

    <div id="ui-overlay" style="pointer-events: none;">
        <div style="pointer-events: auto; display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center;">
            <button class="btn" id="btn-mic" onclick="startVoiceInput()">🎤 Voice</button>
            <button class="btn" id="btn-chat" onclick="toggleChat()">💬 Chat</button>
            <button class="btn" id="btn-memory" onclick="showMemory()">🧠 Memory</button>
            <button class="btn" id="btn-agents" onclick="showAgents()">🤖 Agents</button>
        </div>
    </div>

    <div id="subtitle" class="subtitle"></div>

    <div id="chat-modal" style="display:none; position:fixed; inset:0; background:rgba(10,10,16,0.95); z-index:100; display:flex; flex-direction:column; font-family:inherit;">
        <div style="padding:1rem; border-bottom:1px solid #30363d; display:flex; justify-content:space-between; align-items:center;">
            <h3 style="font-size:1rem;">TOLIK Chat</h3>
            <button onclick="toggleChat()" style="background:none; border:none; color:#8b949e; font-size:1.5rem; cursor:pointer;">×</button>
        </div>
        <div id="chat-messages" style="flex:1; overflow:auto; padding:1rem; display:flex; flex-direction:column; gap:0.75rem;"></div>
        <div style="padding:1rem; border-top:1px solid #30363d; display:flex; gap:0.5rem;">
            <input type="text" id="chat-input" placeholder="Message TOLIK..." style="flex:1; padding:0.75rem; background:#0d1117; border:1px solid #30363d; border-radius:6px; color:#c9d1d9; font-family:inherit; font-size:1rem;">
            <button onclick="sendChat()" class="btn">Send</button>
        </div>
    </div>

    <script type="module">
        import { SystemClock, randomId, sha256Hex } from './clock.js';
        import { AuditLog, LogLevel } from './audit.js';
        import { IdentityStore } from './identity.js';
        import { AuthorizationEngine, Decision, ROLE_RISK_CEILING, CONFIRMATION_METHODS } from './policy.js';
        import { PeerRegistry, SignedTransport } from './transport.js';
        import { StepStatus, TaskManager, TaskState, describeTask } from './tasks.js';
        import { VirtualFileSystem } from './vfs.js';
        import { WindowsAgent, AgentState, describeAgent } from './agent.js';
        import {
            AgentCapability,
            CAPABILITY_SPEC,
            IdentityRole,
            MessageType,
            RISK_ORDER,
            ToolRiskLevel,
            buildEnvelope,
            describeContracts,
            parseEnvelope,
            serializeEnvelope,
        } from './contracts.js';
        import { Planner } from './planner.js';
        import { TextModelRouter, buildAnswerPrompt, deterministicAnswer, summarizeTaskForModel } from './model.js';
        import { PROJECT_ROOT, seedWorkspace } from './workspace.js';
        import { SystemClock, randomId, sha256Hex } from './clock.js';
        import { canonicalJson } from './strict-json.js';
        import { redactText, scanForSecrets } from './secrets.js';

        // --- Configuration ---
        const CORE_URL = 'http://127.0.0.1:5080';
        const VOICE_URL = 'http://127.0.0.1:9660';
        const WS_URL = 'ws://127.0.0.1:5080/events/ws';

        // --- State ---
        let ws = null;
        let token = localStorage.getItem('tolik_token') || '';
        let voiceMode = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let currentSubtitle = '';

        // --- DOM Elements ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const subtitleEl = document.getElementById('subtitle');
        const statusDots = {
            core: document.getElementById('core-status'),
            voice: document.getElementById('voice-status'),
            agent: document.getElementById('agent-status'),
            memory: document.getElementById('memory-status'),
        };
        const subtitleEl = document.getElementById('subtitle');
        const chatModal = document.getElementById('chat-modal');
        const chatInput = document.getElementById('chat-input');
        const chatMessages = document.getElementById('chat-messages');
        const btnMic = document.getElementById('btn-mic');
        const chatModalEl = document.getElementById('chat-modal');
        const chatInput = document.getElementById('chat-input');
        const chatMessages = document.getElementById('chat-messages');

        // --- Canvas Eye Animation ---
        let animationFrame = null;
        let eyeState = 'idle'; // idle, thinking, speaking, denied, locked
        let pupilOffset = { x: 0, y: 0 };
        let pupilTarget = { x: 0, y: 0 };
        let blinkTimer = null;
        let animationTime = 0;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawEye() {
            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;
            const eyeRadius = Math.min(w, h) * 0.28;
            const pupilRadius = eyeRadius * 0.35;

            ctx.clearRect(0, 0, w, h);

            // Smooth pupil movement
            pupilOffset.x += (pupilTarget.x - pupilOffset.x) * 0.1;
            pupilOffset.y += (pupilTarget.y - pupilOffset.y) * 0.1;

            // Eye whites
            const eyeOffset = eyeRadius * 0.7;
            const leftEyeX = cx - eyeOffset;
            const rightEyeX = cx + eyeOffset;
            const eyeY = cy;

            // Draw eye whites
            ctx.fillStyle = '#0d1117';
            ctx.beginPath();
            ctx.ellipse(cx - eyeOffset, cy, eyeRadius * 1.1, eyeRadius * 1.3, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(cx + eyeOffset, cy, eyeRadius * 1.1, eyeRadius * 1.3, 0, 0, Math.PI * 2);
            ctx.fill();

            // Iris
            const irisRadius = eyeRadius * 0.65;
            const irisColor = getIrisColor();
            ctx.fillStyle = irisColor;
            ctx.beginPath();
            ctx.ellipse(cx - eyeOffset + pupilOffset.x, cy + pupilOffset.y, irisRadius, irisRadius, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(cx + eyeOffset + pupilOffset.x, cy + pupilOffset.y, irisRadius, irisRadius, 0, 0, Math.PI * 2);
            ctx.fill();

            // Pupil
            const pupilR = pupilRadius;
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.ellipse(cx - eyeOffset + pupilOffset.x, cy + pupilOffset.y, pupilR, pupilR, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(cx + eyeOffset + pupilOffset.x, cy + pupilOffset.y, pupilR, pupilR, 0, 0, Math.PI * 2);
            ctx.fill();

            // Reflection
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath();
            ctx.ellipse(cx - eyeOffset + pupilOffset.x - pupilR * 0.3, cy + pupilOffset.y - pupilR * 0.3, pupilR * 0.25, pupilR * 0.25, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(cx + eyeOffset + pupilOffset.x - pupilR * 0.3, cy + pupilOffset.y - pupilR * 0.3, pupilR * 0.25, pupilR * 0.25, 0, 0, Math.PI * 2);
            ctx.fill();

            // Eyelids based on state
            drawEyelids();

            // State label
            drawStateLabel();
        }

        function getIrisColor() {
            switch (eyeState) {
                case 'thinking': return '#58a6ff';
                case 'speaking': return '#3fb950';
                case 'denied': return '#f85149';
                case 'locked': return '#f85149';
                default: return '#58a6ff'; // idle
            }
        }

        function drawEyelids() {
            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;
            const eyeRadius = Math.min(w, h) * 0.28;

            const eyelidHeight = getEyelidHeight();
            if (eyelidHeight <= 0) return;

            ctx.fillStyle = '#0a0a0f';
            const eyeOffset = Math.min(w, h) * 0.28 * 0.7;

            // Upper eyelids
            ctx.beginPath();
            ctx.ellipse(canvas.width / 2 - Math.min(w, h) * 0.2, canvas.height / 2, Math.min(w, h) * 0.28 * 1.1, eyelidHeight, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(canvas.width / 2 + Math.min(w, h) * 0.2, canvas.height / 2, Math.min(w, h) * 0.28 * 1.1, eyelidHeight, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        function getEyelidHeight() {
            switch (eyeState) {
                case 'thinking': return Math.min(canvas.width, canvas.height) * 0.28 * 0.3;
                case 'speaking': return Math.min(canvas.width, canvas.height) * 0.28 * 0.15;
                case 'denied': return Math.min(canvas.width, canvas.height) * 0.28 * 0.5;
                case 'locked': return Math.min(canvas.width, canvas.height) * 0.28 * 0.7;
                default: return 0; // idle - open
            }
        }

        function drawStateLabel() {
            ctx.font = '12px "JetBrains Mono", monospace';
            ctx.fillStyle = '#8b949e';
            ctx.textAlign = 'center';
            const label = eyeState.toUpperCase();
            ctx.fillText(label, canvas.width / 2, canvas.height * 0.85);
        }

        function animate() {
            animationTime += 1/60;
            
            // Subtle breathing animation for idle state
            if (eyeState === 'idle') {
                const breath = Math.sin(animationTime * 0.5) * 0.02;
                pupilTarget.x = Math.sin(animationTime * 0.3) * 0.1;
                pupilTarget.y = Math.sin(animationTime * 0.2) * 0.05;
            } else if (eyeState === 'thinking') {
                pupilTarget.x = Math.sin(animationTime * 2) * 0.4;
                pupilTarget.y = Math.cos(animationTime * 1.5) * 0.2;
            } else if (eyeState === 'speaking') {
                pupilTarget.x = Math.sin(animationTime * 5) * 0.2;
                pupilTarget.y = Math.cos(animationTime * 3) * 0.1;
            }

            drawEye();
            animationFrame = requestAnimationFrame(animate);
        }

        function setEyeState(state) {
            eyeState = state;
            updateStatusDots();
        }

        function updateStatusDots() {
            const colors = {
                core: 'healthy',
                voice: 'healthy',
                agent: 'healthy',
                memory: 'healthy',
            };
            // Update based on actual health checks
            Object.keys(statusDots).forEach(key => {
                const dot = statusDots[key];
                dot.className = 'status-dot ' + (colors[key] || 'healthy');
            });
        }

        function showSubtitle(text) {
            subtitleEl.textContent = text;
            subtitleEl.classList.add('visible');
            clearTimeout(subtitleEl.hideTimer);
            subtitleEl.hideTimer = setTimeout(() => {
                subtitleEl.classList.remove('visible');
            }, 4000);
        }

        function updateStatusDotsFromHealth(health) {
            if (health.core) statusDots.core.className = 'status-dot ' + (health.core ? 'healthy' : 'critical');
            if (health.voice) statusDots.voice.className = 'status-dot ' + (health.voice ? 'healthy' : 'critical');
            if (health.agent) statusDots.agent.className = 'status-dot ' + (health.agent ? 'healthy' : 'critical');
            if (health.memory) statusDots.memory.className = 'status-dot ' + (health.memory ? 'healthy' : 'critical');
        }

        // --- WebSocket Connection ---
        function connectWS() {
            if (!token) {
                console.warn('No token, skipping WS connection');
                return;
            }
            ws = new WebSocket(`${WS_URL}?token=${encodeURIComponent(token)}`);
            ws.onopen = () => console.log('WS connected');
            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'event' && msg.payload) {
                        handleRealtimeEvent(msg.payload);
                    }
                } catch (e) {
                    console.error('WS parse error', e);
                }
            };
            ws.onclose = () => {
                console.log('WS closed, reconnecting in 5s...');
                setTimeout(connectWS, 5000);
            };
            ws.onerror = (err) => console.error('WS error', err);
        }

        function handleRealtimeEvent(payload) {
            if (payload.kind === 'ProactiveMessage') {
                showSubtitle(payload.text);
            } else if (payload.kind === 'TaskStarted') {
                setEyeState('thinking');
            } else if (payload.kind === 'TaskCompleted') {
                setEyeState('idle');
            } else if (payload.kind === 'ToolStarted') {
                setEyeState('thinking');
            } else if (payload.kind === 'ToolCompleted') {
                setEyeState('idle');
            }
        }

        // --- API Helpers ---
        async function api(path, options = {}) {
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = 'Bearer ' + token;
            const res = await fetch(`${CORE_URL}${path}`, { ...options, headers });
            if (!res.ok) {
                const text = await res.text();
                throw new Error(`API ${res.status}: ${text}`);
            }
            return res.json();
        }

        async function apiPost(path, body) {
            return api(path, { method: 'POST', body: JSON.stringify(body) });
        }

        // --- Voice Input ---
        async function startVoiceInput() {
            if (!navigator.mediaDevices?.getUserMedia) {
                showSubtitle('Microphone not available');
                return;
            }
            if (!token) {
                showSubtitle('Please login first');
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    stream.getTracks().forEach(t => t.stop());
                    const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
                    await voiceTurn(blob);
                };

                mediaRecorder.start();
                btnMic.textContent = '⏹';
                btnMic.classList.add('recording');
                showSubtitle('Listening...');
            } catch (e) {
                showSubtitle('Mic error: ' + e.message);
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            btnMic.textContent = '🎤';
            btnMic.classList.remove('recording');
        }

        async function voiceTurn(blob) {
            try {
                const audioBytes = new Uint8Array(await blob.arrayBuffer());
                const res = await fetch(`${CORE_URL}/voice/turn`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ audio: Array.from(audioBytes), mode: 'Normal', runtimeMode: 'Normal' })
                });
                const data = await response.json();
                if (!res.ok) throw new Error(data.error || res.status);
                return data;
            } catch (e) {
                console.error('Voice turn error', e);
                showSubtitle('Voice error: ' + e.message);
            }
        }

        // --- Chat ---
        function toggleChat() {
            chatModalEl.style.display = chatModalEl.style.display === 'flex' ? 'none' : 'flex';
            if (chatModalEl.style.display === 'flex') {
                chatInput.focus();
            }
        }

        async function sendChat() {
            const text = chatInput.value.trim();
            if (!text) return;
            chatInput.value = '';
            addChatMessage(text, 'user');
            
            try {
                const res = await apiPost('/chat', { message: text });
                addChatMessage(res.answer || res.message, 'assistant');
            } catch (e) {
                addChatMessage('Error: ' + e.message, 'system');
            }
        }

        function addChatMessage(text, role) {
            const div = document.createElement('div');
            div.style.cssText = `padding:0.5rem; background:${role==='user'?'#1f6feb22':'#161b22'}; border-radius:6px; margin-bottom:0.5rem; max-width:80%; ${role==='user'?'margin-left:auto;':'margin-right:auto;'}`;
            div.textContent = (role==='user'?'You: ':'TOLIK: ') + text;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function api(path, options = {}) {
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = 'Bearer ' + token;
            const res = await fetch(`${CORE_URL}${path}`, { ...options, headers });
            if (!res.ok) throw new Error(await res.text());
            return res.json();
        }

        async function apiPost(path, body) {
            return api(path, { method: 'POST', body: JSON.stringify(body) });
        }

        // --- Memory ---
        async function showMemory() {
            const query = prompt('Search memory:');
            if (!query) return;
            const res = await fetch(`${CORE_URL}/memory/search?q=${encodeURIComponent(query)}`, {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const data = await res.json();
            alert(JSON.stringify(data, null, 2));
        }

        async function showAgents() {
            const res = await fetch(`${CORE_URL}/agents`, { headers: { 'Authorization': 'Bearer ' + token } });
            const data = await res.json();
            alert(JSON.stringify(data, null, 2));
        }

        // --- Initialize ---
        async function init() {
            if (token) {
                const health = await fetch(`${CORE_URL}/health`).then(r => r.json());
                updateStatusDotsFromHealth(health);
                connectWS();
            }
            animate();
        }

        // Start
        init();

        // Global functions for onclick handlers
        window.startVoiceInput = startVoiceInput;
        window.stopRecording = stopRecording;
        window.voiceTurn = voiceTurn;
        window.toggleChat = toggleChat;
        window.sendChat = sendChat;
        window.showMemory = showMemory;
        window.showAgents = showAgents;
    </script>
</body>
</html>
